    const k = SP(t, s + 2.45, 20), r = morph(rectPts(A1[0], A1[1], 150, 70, 30), rectPts(...A1, 30), k);
    if (t < out) ln(r, { closed: true, w: 3, seed: 330 });
    else { const p = 1 - XI(t, out, .15); if (p > .01) ln(rectPts(...A1, 30), { closed: true, w: 3, prog: p, seed: 330 }); }
    const n1 = typedN(len('bizplan 스킬 15종 설치 완료'), t, s + 2.5, .3, out, .12);
    if (n1 > 0) check(A1[0] + 50, A1[1] + 50, 36, 'accent');
    txt('bizplan 스킬 15종 설치 완료', A1[0] + 90, A1[1] + 62, { size: 40, wt: 800, n: n1 });
    txt('이제 /bizplan 으로 시작하세요', A1[0] + 36, A1[1] + 114, { size: 32, wt: 700, c: 'accent', n: typedN(len('이제 /bizplan 으로 시작하세요'), t, s + 2.75, .3, out, .12) });
  }
  // you: start
  bub(U2, s + 3.4, 340);
  txt('/bizplan 사업계획서 같이 써줘', U2[0] + 36, U2[1] + 56, { size: 33, wt: 600, fam: 'mono', n: typedN(len('/bizplan 사업계획서 같이 써줘'), t, s + 3.45, .5, out, .12) });
  // agent: reply
  bub(A2, s + 4.45, 350);
  txt('좋아요. 큰틀부터 잡아볼게요.', A2[0] + 36, A2[1] + 58, { size: 38, wt: 800, n: typedN(len('좋아요. 큰틀부터 잡아볼게요.'), t, s + 4.5, .35, out, .12) });
  // the guide stands next to its replies
  if (t >= s + 2.45) {
    const k = .64 * SP(t, s + 2.45, 22) * (1 - XI(t, out, .2)), yF = mix(A1[1] + A1[3], A2[1] + A2[3], SP(t, s + 4.45, 18));
    mascot(312, yF, { k });
  }
}

// ───────────────────────── TERMINAL install — the alternative (36–41 s) ─────────────────────────
function partTerm(t) {
  const s = SEC.term, enter = s - .05, out = SEC.skills - .05;
  if (t < out) PANEL.forEach((p, i) => ln(morph(rectPts(...CHATW, 18), rectPts(...p, 14), SP(t, enter + i * .05, 16)), { closed: true, w: 3, seed: 360 + i }));
  [['Claude Code', s + .2], ['Codex', s + .3]].forEach(([a, t0], p) => {
    const [x, y, w] = PANEL[p];
    txt(a, x + 44, y + 62, { size: 40, wt: 800, n: typedN(a.length, t, t0, .15, out, .12) });
    txt('METHOD 02 · TERMINAL', x + w - 44, y + 62, { size: 24, wt: 700, track: .18, align: 'right', c: 'accent', n: typedN(20, t, t0 + .05, .2, out, .12) });
    const dp = XO(t, t0, .3) * (1 - XI(t, out, .15));
    if (dp > .01) ln([[x + 30, y + 86], [x + w - 30, y + 86]], { w: 1.6, prog: dp, seed: 370 + p });
  });
  [0, 1].forEach(p => {
    const [x, y] = PANEL[p], top = y + 92;
    TERM.filter(l => l.p === p).forEach((l, i) => {
      if (t < l.t) return;
      const by = top + 64 + i * 60, n = typedN(len(l.s), t, l.t, l.d, out, .15);
      if (l.k === 'cmd') {
        if (t < out + .05) txt('›', x + 44, by, { size: 36, wt: 700, fam: 'mono', c: 'accent' });
        txt(l.s, x + 82, by, { size: 34, wt: 600, fam: 'mono', n });
        if (t < l.t + l.d + .25 && t < out && Math.floor(t * 8) % 2 === 0) solid(rectPts(x + 82 + tw(Array.from(l.s).slice(0, n).join(''), 34, 600, 'mono') + 4, by - 30, 18, 36), 'accent');
      } else if (n > 0) {
        check(x + 60, by - 12, 30, 'accent');
        txt(l.s, x + 92, by, { size: 34, wt: 800, c: 'accent', n });
      }
    });
  });
}

// ───────────────────────── SKILLS (41–43.5 s) ─────────────────────────
function partSkills(t) {
  const s = SEC.skills, enter = s - .05, out = SEC.link - .05;
  SKILLS.forEach((name, k) => {
    if (t >= out) return;
    const [x, y, w, h] = CHIP(k), t0 = enter + Math.floor(k / 2) * .1;
    ln(morph(rectPts(...PANEL[k < 8 ? 0 : 1], 14), rectPts(x, y, w, h, 46), SP(t, t0, 22)), { closed: true, w: 3, c: k === 15 ? 'accent' : 'main', seed: 380 + k });
    const tr = s + 1.2 + Math.floor(k / 4) * .25;
    const fill = k === 15 ? XO(t, tr, .3) : XO(t, tr, .12) * (1 - XI(t, tr + .16, .12));
    if (fill > .01) hatch(rectPts(x, y, w, h, 46), fill, { gap: 12, seed: 390 + k, alpha: .7 });
    txt(name, x + w / 2 - (k === 15 ? 34 : 0), y + 58, { size: 34, wt: 600, fam: 'mono', align: 'center', c: k === 15 ? 'accent' : 'main', n: typedN(name.length, t, t0 + .12, .15, out, .1) });
    if (k === 15) txt('NEW', x + w - 40, y + 57, { size: 22, wt: 900, align: 'right', c: 'accent', n: typedN(3, t, t0 + .2, .08, out, .1) });
  });
  txt('BIZPLAN SKILLS × 15', 180, 262, { size: 30, wt: 800, track: .14, c: 'accent', n: typedN(19, t, s + .2, .2, out, .12) });
  txt('+ outline (NEW)', 1740, 262, { size: 26, wt: 700, track: .1, align: 'right', n: typedN(15, t, s + .3, .2, out, .12) });
}

// ───────────────────────── LINK → END (43.5–48 s) ─────────────────────────
function partLink(t) {
  const s = SEC.link, enter = s - .05, merge = s + .45, toEnd = SEC.end - .05, gone = SEC.end - .55;
  if (t < merge + .05) {
    SKILLS.forEach((name, k) => {
      const [x, y, w, h] = CHIP(k), sx = 300 + k * 82.5;
      ln(morph(rectPts(x, y, w, h, 46), lineLoop(sx, 600, sx + 70, 600), SP(t, enter + k * .02, 20)), { closed: true, w: 3, seed: 380 + k });
    });
  }
  if (t >= merge) {
    const k = SP(t, toEnd, 14), y = mix(600, RAIL0, k), half = mix(660, 810, k);
    ln([[960 - half, y], [960 + half, y]], { w: 3.4, seed: 2 });
    if (t >= s + 1.95 && t < s + 2.55) {
      const p = XIO(t, s + 1.95, .5), sx = mix(300, 1620, p);
      ln([[Math.max(300, sx - 120), 600], [Math.min(1620, sx + 120), 600]], { w: 6, c: 'accent', seed: 3 });
    }
    const g = SP(t, toEnd, 14);
    title({ size: mix(210, TS, g), y: mix(572, TY, g), sy: SP(t, merge, 18), ay: 600 });
  }
  txt(URL, 960, 692, { size: 50, wt: 700, fam: 'mono', align: 'center', c: 'accent', n: typedN(URL.length, t, s + .95, .5, gone, .2) });
  [['Claude Code', 640], ['Codex', 980]].forEach(([str, x], i) => {
    const p = XO(t, s + 1.45 + i * .08, .2) * (1 - XI(t, gone, .2));
    if (p > .01) ln(rectPts(x, 758, 300, 68, 34), { closed: true, w: 2.6, prog: p, seed: 340 + i });
    const f = XO(t, s + 1.7 + i * .25, .3) * (1 - XI(t, gone, .2));
    if (f > .01) hatch(rectPts(x, 758, 300, 68, 34), f, { gap: 12, seed: 345 + i });
    txt(str, x + 150, 804, { size: 32, wt: 700, align: 'center', n: typedN(str.length, t, s + 1.5 + i * .08, .15, gone, .15) });
  });
  if (t >= SEC.end + .25) {
    const p = XO(t, SEC.end + .25, .85);
    mascot(mix(-260, 1560, p), RAIL0, p < .985 ? { run: (t - SEC.end - .25) * 6, lean: 7 * (1 - p) } : {});
  }
  if (t >= SEC.end + .75) openLabels(clamp((t - SEC.end - .75) / .3));
}

// ───────────────────────── chrome ─────────────────────────
function captions(t) {
  for (const [str, t0, t1] of CAPTIONS) {
    if (t < t0 || t > t1 + .25) continue;
    const n = typedN(len(str), t, t0, .35, t1, .2);
    if (n <= 0) continue;
    const x0 = 960 - tw(str, 46, 800) / 2;
    solid(rectPts(x0 - 38, 962 - 30, 16, 16), 'accent');
    txt(str, x0, 962, { size: 46, wt: 800, n });
  }
}
function corners(t) {
  let idx = 0; SECTIONS.forEach(([st], i) => { if (t >= st) idx = i; });
  const beat = Math.min(BEATS - 1, Math.floor(t / BEAT)), pad = n => String(n).padStart(2, '0');
  txt(`FIG. ${pad(idx + 1)} — ${SECTIONS[idx][1]}`, 150, 114, { size: 24, wt: 700, track: .2 });
  txt(`BEAT ${pad(beat + 1)} / ${BEATS}`, 1770, 990, { size: 24, wt: 700, track: .2, align: 'right' });
}
function scene(t) {
  if (t < SEC.outline + .1) partOpen(t);
  if (t >= SEC.outline && t < SEC.psst + .4) partOutline(t);
  if (t >= SEC.psst - .05 && t < SEC.match + .5) partPSST(t);
  if (t >= SEC.match - .05 && t < SEC.market + .5) partMatch(t);
  if (t >= SEC.market - .05 && t < SEC.review + .4) partMarket(t);
  if (t >= SEC.review - .05 && t < SEC.pitch + .4) partReview(t);
  if (t >= SEC.pitch - .05 && t < SEC.export + .4) partPitch(t);
  if (t >= SEC.export - .05 && t < SEC.chat + .4) partExport(t);
  if (t >= SEC.chat - .05 && t < SEC.term + .4) partChat(t);
  if (t >= SEC.term - .05 && t < SEC.skills + .4) partTerm(t);
  if (t >= SEC.skills - .05 && t < SEC.link + .4) partSkills(t);
  if (t >= SEC.link - .05) partLink(t);
  captions(t); corners(t);
}

// ───────────────────────── backgrounds & passes ─────────────────────────
const cv = document.getElementById('c'), X = cv.getContext('2d');
const layer = document.createElement('canvas'); layer.width = W; layer.height = H; const L = layer.getContext('2d');
G = L;
function noiseCanvas(seed, fn) {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d'), img = g.createImageData(W, H);
  let s = seed >>> 0; const rnd = () => { s += 0x6D2B79F5; let r = Math.imul(s ^ s >>> 15, 1 | s); r ^= r + Math.imul(r ^ r >>> 7, 61 | r); return ((r ^ r >>> 14) >>> 0) / 4294967296; };
  for (let i = 0; i < W * H; i++) { const [r, gg, b, a] = fn(rnd); img.data[i * 4] = r; img.data[i * 4 + 1] = gg; img.data[i * 4 + 2] = b; img.data[i * 4 + 3] = a; }
  g.putImageData(img, 0, 0); return c;
}
let GRAIN, TOOTH;
function background(g, ink) {
  g.fillStyle = INKS[ink].bg; g.fillRect(0, 0, W, H);
  if (ink !== 'blue') { g.globalCompositeOperation = 'multiply'; g.drawImage(GRAIN, 0, 0); g.globalCompositeOperation = 'source-over'; }
  g.save(); g.lineWidth = 1;
  if (ink === 'note') {
    // lined notebook: ruled lines + red margin
    g.strokeStyle = COL.blue;
    for (let y = 132, i = 0; y < H; y += 54, i++) { g.globalAlpha = .2; g.beginPath(); g.moveTo(0, y + .5); g.lineTo(W, y + .5); g.stroke(); }
    g.strokeStyle = COL.margin; g.globalAlpha = .55; g.lineWidth = 2;
    g.beginPath(); g.moveTo(116, 0); g.lineTo(116, H); g.stroke();
    g.globalAlpha = .3; g.beginPath(); g.moveTo(122, 0); g.lineTo(122, H); g.stroke();
  } else {
    g.strokeStyle = INKS[ink].grid;
    for (let x = 0, i = 0; x <= W; x += 60, i++) { g.globalAlpha = i % 5 === 0 ? .26 : .13; g.beginPath(); g.moveTo(x + .5, 0); g.lineTo(x + .5, H); g.stroke(); }
    for (let y = 0, i = 0; y <= H; y += 60, i++) { g.globalAlpha = i % 5 === 0 ? .26 : .13; g.beginPath(); g.moveTo(0, y + .5); g.lineTo(W, y + .5); g.stroke(); }
  }
  g.restore();
}
function pass(ink, t, clip) {
  X.save();
  if (clip) { X.beginPath(); clip(X); X.clip(); }
  X.globalCompositeOperation = 'source-over'; X.globalAlpha = 1;
  background(X, ink);
  L.setTransform(1, 0, 0, 1, 0, 0); L.globalCompositeOperation = 'source-over'; L.globalAlpha = 1; L.clearRect(0, 0, W, H);
  INK = ink; scene(t);
  if (ink !== 'blue') {
    L.globalCompositeOperation = 'destination-out'; L.drawImage(TOOTH, 0, 0); L.globalCompositeOperation = 'source-over';
    X.globalCompositeOperation = 'multiply';
  }
  X.drawImage(layer, 0, 0);
  X.restore();
}
function scanLine(y) { X.save(); X.fillStyle = COL.blue; X.fillRect(0, y - 3, W, 6); X.fillStyle = COL.white; X.fillRect(0, y - 1, W, 2); X.restore(); }
const FLOOD = [SEC.market - .5, .45], SCAN1 = SEC.chat - .5, SCAN2 = SEC.end - .5;
function render(t) {
  T = t;
  if (t < FLOOD[0]) pass('paper', t);
  else if (t < FLOOD[0] + FLOOD[1]) {
    const R = STAMP[2] + 2300 * XI(t, FLOOD[0], FLOOD[1]);
    pass('paper', t); pass('blue', t, g => g.arc(STAMP[0], STAMP[1], R, 0, Math.PI * 2));
  } else if (t < SCAN1) pass('blue', t);
  else if (t < SCAN1 + .5) {
    const y = mix(-4, H + 4, XIO(t, SCAN1, .5));
    pass('blue', t, g => g.rect(0, y, W, H - y)); pass('note', t, g => g.rect(0, 0, W, y)); scanLine(y);
  } else if (t < SCAN2) pass('note', t);
  else if (t < SCAN2 + .5) {
    const y = mix(H + 4, -4, XIO(t, SCAN2, .5));
    pass('note', t, g => g.rect(0, 0, W, y)); pass('paper', t, g => g.rect(0, y, W, H - y)); scanLine(y);
  } else pass('paper', t);
}

// ───────────────────────── sound events & music map (read by sound.py) ─────────────────────────
function events() {
  const E = [], e = (t, kind, x = {}) => E.push({ t: +t.toFixed(4), kind, ...x });
  const keys = (str, t0, d) => { const n = len(str); for (let i = 0; i < n; i++) e(t0 + d * i / n, 'key'); };
  e(0, 'steps', { d: .45 }); e(.36, 'whoosh', { d: .14 }); e(.5, 'press');
  e(.95, 'pencil', { d: .3 }); e(1.0, 'ticks', { d: .4 }); e(1.45, 'pencil', { d: .25 });
  e(2.0, 'scribble', { d: .4 }); e(2.2, 'whip'); e(2.95, 'pencil', { d: .25 }); e(3.7, 'clap');
  for (let i = 0; i < 7; i++) e(3.8 + i * .06, 'drop'); e(4.95, 'clap');
  const o = SEC.outline;
  e(o + .05, 'pencil', { d: .25 }); e(o + .15, 'scribble', { d: .4 });
  for (let i = 0; i < 4; i++) { e(o + .45 + i * .75, 'pencil', { d: .2 }); e(o + .5 + i * .75, 'scribble', { d: .7 }); }
  e(o + 3.45, 'scribble', { d: .35 }); e(o + 3.95, 'stamp'); e(o + 4.45, 'scribble', { d: .4 });
  const p = SEC.psst;
  e(p - .05, 'whoosh', { d: .25 }); for (let i = 0; i < 4; i++) e(p + .45 + i * .3, 'stamp', { soft: 1 }); e(p + 1.95, 'scribble', { d: .45 });
  const m = SEC.match;
  e(m - .05, 'whoosh', { d: .3 }); e(m + .15, 'scribble', { d: .5 }); for (let j = 0; j < 3; j++) e(m + .95 + j * .3, 'pencil', { d: .25 });
  e(m + 1.95, 'stamp'); e(FLOOD[0], 'flood', { d: FLOOD[1] }); e(FLOOD[0] + FLOOD[1], 'impact');
  const k = SEC.market;
  e(k + .1, 'tick'); e(k + .45, 'tick'); e(k + .95, 'tick'); e(k + 1.45, 'type', { d: .4, n: 12 });
  const r = SEC.review;
  e(r - .05, 'whoosh', { d: .25 }); e(r + .05, 'riser', { d: 1.0 }); for (let j = 0; j < 4; j++) e(r + .95 + j * .3, 'stamp', { soft: 1 }); e(r + 2.45, 'tick'); e(r + 2.55, 'tick');
  const q = SEC.pitch;
  e(q - .05, 'whoosh', { d: .25 }); for (let i = 0; i < 6; i++) e(q + .45 + i * .04, 'pop'); for (let i = 0; i < 6; i++) e(q + 1.2 + i * .15, 'tick', { soft: 1 }); e(q + 1.95, 'tick');
  const x = SEC.export;
  e(x - .05, 'whoosh', { d: .25 }); e(x + .25, 'type', { d: .6, n: 12 }); e(x + .95, 'stamp'); e(SCAN1, 'scan', { d: .5 }); e(SCAN1 + .5, 'impact');
  const c = SEC.chat;
  e(c + .15, 'tick'); e(c + .23, 'tick'); keys(LINK, c + .5, .8); keys('이 스킬 설치해줘', c + 1.45, .3); e(c + 1.8, 'pop');
  for (let i = 0; i < 4; i++) e(c + 1.95 + i * .125, 'tick', { soft: 1 }); e(c + 2.45, 'ding');
  e(c + 3.4, 'pop'); keys('/bizplan 사업계획서 같이 써줘', c + 3.45, .5); e(c + 4.45, 'reply');
  e(SEC.term - .05, 'whoosh', { d: .25 });
  TERM.forEach(l => { if (l.k === 'cmd') keys(l.s, l.t, l.d); else e(l.t, 'ding'); });
  const sk = SEC.skills;
  e(sk - .05, 'whoosh', { d: .25 }); for (let i = 0; i < 8; i++) e(sk - .05 + i * .1, 'pop'); for (let i = 0; i < 4; i++) e(sk + 1.2 + i * .25, 'tick', { soft: 1 });
  const li = SEC.link;
  e(li - .05, 'whoosh', { d: .3 }); e(li + .45, 'riser', { d: .5 }); keys(URL, li + .95, .5); e(li + 1.45, 'tick'); e(li + 1.53, 'tick'); e(li + 1.95, 'sweep', { d: .5 });
  e(SCAN2, 'scan', { d: .5 }); e(SEC.end - .05, 'whoosh', { d: .4 }); e(SEC.end + .25, 'steps', { d: .8 }); e(SEC.end + .75, 'scribble', { d: .3 });
  return E;
}
function musicMap() {
  const styles = [];
  for (let b = 0; b < DUR / 2; b++) { const t0 = b * 2; styles.push(t0 < 16 ? 'paper' : t0 < 30 ? 'blue' : t0 < SEC.end ? 'note' : 'paper'); }
  return { bpm: BPM, styles };
}

// ───────────────────────── setup & playback ─────────────────────────
async function setup() {
  const loads = [];
  for (const w of [600, 700, 800, 900]) loads.push(document.fonts.load(`${w} 40px Geist`, 'Ab'), document.fonts.load(`${w} 40px BP`, '가'));
  for (const w of [600, 700]) loads.push(document.fonts.load(`${w} 40px 'Geist Mono'`, 'Ab'));
  await Promise.all(loads); await document.fonts.ready;
  G = L;
  const m = measure('bizplan', 100, 900); TS = 100 * TITLE_W / m.width;
  const mm = measure('bizplan', TS, 900); TA = mm.actualBoundingBoxAscent; TD = mm.actualBoundingBoxDescent;
  RAIL0 = 372; LT = RAIL0 + 96; TY = LT + TA;
  const km = measure('사업계획서', 100, 800); KA = km.actualBoundingBoxAscent; KD = km.actualBoundingBoxDescent;
  GRAIN = noiseCanvas(7, r => { const v = r(); return [70, 60, 40, v > .55 ? (v - .55) * 70 : 0]; });
  TOOTH = noiseCanvas(11, r => { const v = r(); return [0, 0, 0, v > .62 ? 60 + r() * 120 : 0]; });
}

const renderMode = new URLSearchParams(location.search).has('render');
function fit() { const s = renderMode ? 1 : Math.min(innerWidth / W, innerHeight / H); cv.style.transform = `scale(${s})`; }
addEventListener('resize', fit); fit();

window.__duration = DUR;
window.__ready = setup().then(() => {
  window.__seek = t => render(((t % DUR) + DUR) % DUR);
  window.__events = events();
  window.__music = musicMap();
  render(0);
  if (!renderMode) {
    let paused = false, off = 0, t0 = performance.now();
    const loop = now => { if (!paused) render(((now - t0) / 1000 + off) % DUR); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
    addEventListener('keydown', e => { if (e.code !== 'Space') return; if (paused) { t0 = performance.now(); paused = false; } else { off += (performance.now() - t0) / 1000; paused = true; } });
  }
});
})();
