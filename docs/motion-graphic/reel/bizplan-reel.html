    txt(a, x + 44, y + 62, { size: 40, wt: 800, c: 'accent', n: typedN(a.length, t, t0, .15, out, .12) });
    txt(b, x + w - 44, y + 62, { size: 22, wt: 700, track: .2, align: 'right', n: typedN(b.length, t, t0 + .05, .15, out, .12) });
    const dp = XO(t, t0, .3) * (1 - XI(t, out, .15));
    if (dp > .01) ln([[x + 30, y + 86], [x + w - 30, y + 86]], { w: 1.6, prog: dp, seed: 310 + p });
  });
  // lines with scroll
  [0, 1].forEach(p => {
    const [x, y, w, h] = PANEL[p], top = y + 92, cap = p === 0 ? 3 : 4, lh = 58;
    const lines = TERM.filter(l => l.p === p);
    let off = 0;
    lines.forEach((l, i) => { if (i >= cap) off += lh * SP(t, l.t, 22); });
    G.save(); G.beginPath(); G.rect(x + 4, top + 14, w - 8, h - 112); G.clip();
    lines.forEach((l, i) => {
      if (t < l.t) return;
      const by = top + 62 + i * lh - off, len = Array.from(l.s).length;
      const n = typedN(len, t, l.t, l.d, out, .15);
      if (l.k === 'cmd') {
        if (t < out + .05) txt('›', x + 44, by, { size: 34, wt: 700, fam: 'mono', c: 'accent' });
        txt(l.s, x + 80, by, { size: 34, wt: 600, fam: 'mono', n });
        const typing = t < l.t + l.d + .25 && t < out;
        if (typing && Math.floor(t * 8) % 2 === 0) {
          const cx = x + 80 + tw(l.s.slice(0, n), 34, 600, 'mono') + 4;
          solid(rectPts(cx, by - 30, 18, 36), 'accent');
        }
      } else {
        if (n > 0) {
          if (l.k === 'ok') check(x + 60, by - 12, 30, 'accent'); else solid(circlePts(x + 58, by - 12, 9, 20), 'main');
        }
        txt(l.s, x + 90, by, { size: 32, wt: 700, c: 'accent', n });
      }
    });
    G.restore();
  });
}

// ───────────────────────── bar 14 : SKILLS ─────────────────────────
function partSkills(t) {
  const enter = 25.95, out = 27.95;
  SKILLS.forEach((s, k) => {
    const src = rectPts(...PANEL[k < 8 ? 0 : 1], 14), [x, y, w, h] = CHIP(k), t0 = enter + Math.floor(k / 2) * .125;
    if (t >= out) return;
    ln(morph(src, rectPts(x, y, w, h, 46), SP(t, t0, 22)), { closed: true, w: 3, seed: 320 + k });
    // a scan band passes through each row on the beat, then clears so labels stay readable
    const tr = 26.95 + Math.floor(k / 4) * .25, fill = k === 15 ? XO(t, tr, .3) * (1 - XI(t, out, .12)) : XO(t, tr, .12) * (1 - XI(t, tr + .14, .12));
    if (fill > .01) hatch(rectPts(x, y, w, h, 46), fill, { lit: k === 15 ? .25 : .15, c: k === 15 ? 'accent' : undefined });
    const n = typedN(s.length, t, t0 + .12, .12, out, .1);
    txt(s, x + w / 2 - (k === 15 ? 34 : 0), y + 58, { size: 32, wt: 600, fam: 'mono', align: 'center', c: k === 15 ? 'accent' : 'main', n });
    if (k === 15) txt('NEW', x + w - 40, y + 56, { size: 20, wt: 900, align: 'right', c: 'accent', n: typedN(3, t, t0 + .2, .08, out, .1) });
  });
  txt('BIZPLAN SKILLS × 15', 180, 262, { size: 28, wt: 800, track: .16, c: 'accent', n: typedN(19, t, 26.2, .2, out, .12) });
  txt('+ outline (NEW)', 1740, 262, { size: 24, wt: 700, track: .12, align: 'right', n: typedN(15, t, 26.3, .2, out, .12) });
}

// ───────────────────────── bars 15–17 : link → end ─────────────────────────
function partLink(t) {
  const enter = 27.95, merge = 28.45, toEnd = 32.45;
  // chips collapse into dashes, then one line
  if (t < merge + .05) {
    SKILLS.forEach((s, k) => {
      const [x, y, w, h] = CHIP(k), sx = 300 + k * 82.5;
      ln(morph(rectPts(x, y, w, h, 46), lineLoop(sx, 600, sx + 70, 600), SP(t, enter + k * .02, 20)), { closed: true, w: 3, seed: 320 + k });
    });
  }
  // the line (and rail on the way back to frame 0)
  if (t >= merge) {
    const k = SP(t, toEnd, 14);
    const y = mix(600, RAIL0, k), half = mix(660, 810, k);
    ln([[960 - half, y], [960 + half, y]], { w: 3.4, seed: 2 });
    // light sweep on the line
    if (t >= 29.95 && t < 30.6) {
      const p = XIO(t, 29.95, .5), sx = mix(300, 1620, p);
      ln([[Math.max(300, sx - 120), 600], [Math.min(1620, sx + 120), 600]], { w: 6, c: 'accent', seed: 3 });
    }
    // word rises out of the line, then grows into the frame-0 title
    const rise = SP(t, merge, 18), g = SP(t, toEnd, 14);
    const size = mix(210, TS, g), base = mix(572, TY, g);
    title({ size, y: base, sy: rise, ay: 600 });
  }
  // URL + pills
  const urlN = typedN(URL.length, t, 28.95, .45, 31.95, .2);
  txt(URL, 960, 690, { size: 48, wt: 700, fam: 'mono', align: 'center', c: 'accent', n: urlN });
  [['Claude Code', 650], ['Codex', 970]].forEach(([s, x], i) => {
    const p = XO(t, 29.45 + i * .08, .2) * (1 - XI(t, 31.95, .2));
    if (p > .01) ln(rectPts(x, 760, 300, 64, 32), { closed: true, w: 2.6, prog: p, seed: 340 + i });
    const f = XO(t, 30.45 + i * .5, .3) * (1 - XI(t, 31.95, .2));
    if (f > .01) hatch(rectPts(x, 760, 300, 64, 32), f, { gap: 12, seed: 345 + i, lit: .3 });
    txt(s, x + 150, 803, { size: 30, wt: 700, align: 'center', n: typedN(s.length, t, 29.5 + i * .08, .15, 31.95, .15) });
  });
  // mascot runs back to its mark, labels return
  if (t >= 32.95) {
    const p = XO(t, 32.95, .9), mx = mix(-260, 1560, p);
    mascot(mx, RAIL0, p < .985 ? { run: (t - 32.95) * 6, lean: 7 * (1 - p) } : {});
  }
  if (t >= 33.45) openLabels(XO(t, 33.45, .3) >= .999 ? 1 : clamp((t - 33.45) / .3));
}

// ───────────────────────── chrome ─────────────────────────
function captions(t) {
  for (const [s, t0, t1] of CAPTIONS) {
    if (t < t0 || t > t1 + .25) continue;
    const len = Array.from(s).length, n = typedN(len, t, t0, .3, t1, .2);
    if (n <= 0) continue;
    const w = tw(s, 40, 800), x0 = 960 - w / 2;
    solid(rectPts(x0 - 34, 958 - 26, 14, 14), 'accent');
    txt(s, x0, 958, { size: 40, wt: 800, n });
  }
}
function corners(t) {
  const bar = Math.min(16, Math.floor(t / 2)), beat = Math.min(BEATS - 1, Math.floor(t / BEAT));
  const pad = n => String(n).padStart(2, '0');
  txt(`FIG. ${pad(bar + 1)} — ${NAMES[bar]}`, 150, 114, { size: 24, wt: 700, track: .2 });
  txt(`BEAT ${pad(beat + 1)} / ${BEATS}`, 1770, 990, { size: 24, wt: 700, track: .2, align: 'right' });
}
function scene(t) {
  if (t < 4.1) partOpen(t);
  if (t >= 4.0 && t < 8.4) partOutline(t);
  if (t >= 7.95 && t < 10.5) partPSST(t);
  if (t >= 9.95 && t < 12.5) partMatch(t);
  if (t >= 11.95 && t < 14.4) partMarket(t);
  if (t >= 13.95 && t < 16.4) partReview(t);
  if (t >= 15.95 && t < 18.4) partPitch(t);
  if (t >= 17.95 && t < 20.4) partExport(t);
  if (t >= 19.95 && t < 26.4) partTerminal(t);
  if (t >= 25.95 && t < 28.4) partSkills(t);
  if (t >= 27.95) partLink(t);
  captions(t); corners(t);
}

// ───────────────────────── backgrounds & passes ─────────────────────────
const cv = document.getElementById('c'), X = cv.getContext('2d');
const layer = document.createElement('canvas'); layer.width = W; layer.height = H; const L = layer.getContext('2d');
G = L;
function noiseCanvas(seed, fn) {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d'), img = g.createImageData(W, H);
  let s = seed >>> 0; const rnd = () => { s += 0x6D2B79F5; let r = Math.imul(s ^ s >>> 15, 1 | s); r ^= r + Math.imul(r ^ r >>> 7, 61 | r); return ((r ^ r >>> 14) >>> 0) / 4294967296; };
  for (let i = 0; i < W * H; i++) { const [r, gg, b, a] = fn(rnd); img.data[i * 4] = r; img.data[i * 4 + 1] = gg; img.data[i * 4 + 2] = b; img.data[i * 4 + 3] = a; }
  g.putImageData(img, 0, 0); return c;
}
let GRAIN, TOOTH;
function grid(g, color) {
  g.save(); g.strokeStyle = color; g.lineWidth = 1;
  for (let x = 0, i = 0; x <= W; x += 60, i++) { g.globalAlpha = i % 5 === 0 ? .26 : .13; g.beginPath(); g.moveTo(x + .5, 0); g.lineTo(x + .5, H); g.stroke(); }
  for (let y = 0, i = 0; y <= H; y += 60, i++) { g.globalAlpha = i % 5 === 0 ? .26 : .13; g.beginPath(); g.moveTo(0, y + .5); g.lineTo(W, y + .5); g.stroke(); }
  g.restore();
}
function pass(ink, t, clip) {
  X.save();
  if (clip) { X.beginPath(); clip(X); X.clip(); }
  X.globalCompositeOperation = 'source-over'; X.globalAlpha = 1;
  X.fillStyle = INKS[ink].bg; X.fillRect(0, 0, W, H);
  if (ink === 'paper') { X.globalCompositeOperation = 'multiply'; X.drawImage(GRAIN, 0, 0); X.globalCompositeOperation = 'source-over'; }
  grid(X, INKS[ink].grid);
  L.setTransform(1, 0, 0, 1, 0, 0); L.globalCompositeOperation = 'source-over'; L.globalAlpha = 1; L.clearRect(0, 0, W, H);
  INK = ink; scene(t);
  if (ink === 'paper') {
    L.globalCompositeOperation = 'destination-out'; L.drawImage(TOOTH, 0, 0); L.globalCompositeOperation = 'source-over';
    X.globalCompositeOperation = 'multiply';
  }
  X.drawImage(layer, 0, 0);
  X.restore();
}
function scanLine(y) {
  X.save(); X.fillStyle = COL.cyan; X.fillRect(0, y - 3, W, 6); X.fillStyle = COL.white; X.fillRect(0, y - 1, W, 2); X.restore();
}
function render(t) {
  T = t;
  if (t < 11.55) pass('paper', t);
  else if (t < 12.0) {
    const R = STAMP[2] + 2300 * XI(t, 11.55, .45);
    pass('paper', t); pass('blue', t, g => g.arc(STAMP[0], STAMP[1], R, 0, Math.PI * 2));
  } else if (t < 19.5) pass('blue', t);
  else if (t < 20.0) {
    const y = mix(-4, H + 4, XIO(t, 19.5, .5));
    pass('blue', t, g => g.rect(0, y, W, H - y)); pass('holo', t, g => g.rect(0, 0, W, y)); scanLine(y);
  } else if (t < 31.5) pass('holo', t);
  else if (t < 32.0) {
    const y = mix(H + 4, -4, XIO(t, 31.5, .5));
    pass('holo', t, g => g.rect(0, 0, W, y)); pass('paper', t, g => g.rect(0, y, W, H - y)); scanLine(y);
  } else pass('paper', t);
}

// ───────────────────────── sound events (read by sound.py) ─────────────────────────
function events() {
  const E = [], e = (t, kind, extra = {}) => E.push({ t: +t.toFixed(4), kind, ...extra });
  e(0, 'steps', { d: .45 }); e(.36, 'whoosh', { d: .14 }); e(.5, 'press');
  e(.95, 'pencil', { d: .3 }); e(1.0, 'ticks', { d: .4 }); e(1.45, 'pencil', { d: .25 });
  e(2.0, 'scribble', { d: .3 }); e(2.2, 'whip'); e(2.95, 'pencil', { d: .2 }); e(3.2, 'clap'); for (let i = 0; i < 7; i++) e(3.3 + i * .05, 'drop');
  e(3.95, 'clap'); e(4.05, 'pencil', { d: .25 }); e(4.15, 'scribble', { d: .3 });
  for (let i = 0; i < 4; i++) { e(4.45 + i * .5, 'pencil', { d: .2 }); e(4.5 + i * .5, 'scribble', { d: .5 }); }
  e(6.45, 'scribble', { d: .3 }); e(6.95, 'stamp'); e(7.45, 'scribble', { d: .35 });
  e(7.95, 'whoosh', { d: .25 }); for (let i = 0; i < 4; i++) e(8.45 + i * .25, 'stamp', { soft: 1 }); e(9.45, 'scribble', { d: .45 });
  e(9.95, 'whoosh', { d: .3 }); e(10.15, 'scribble', { d: .35 }); for (let j = 0; j < 3; j++) e(10.45 + j * .25, 'pencil', { d: .22 });
  e(11.2, 'stamp'); e(11.55, 'flood', { d: .45 }); e(12.0, 'impact');
  e(12.1, 'tick'); e(12.45, 'tick'); e(12.95, 'tick'); e(13.45, 'type', { d: .3, n: 12 });
  e(13.95, 'whoosh', { d: .25 }); e(14.05, 'riser', { d: .9 }); for (let j = 0; j < 4; j++) e(14.45 + j * .25, 'stamp', { soft: 1 }); e(15.45, 'tick'); e(15.55, 'tick');
  e(15.95, 'whoosh', { d: .25 }); for (let i = 0; i < 6; i++) e(16.45 + i * .04, 'pop'); for (let i = 0; i < 6; i++) e(16.95 + i * .125, 'tick', { soft: 1 }); e(17.45, 'tick');
  e(17.95, 'whoosh', { d: .25 }); e(18.25, 'type', { d: .35, n: 10 }); e(18.95, 'stamp');
  e(19.5, 'scan', { d: .5 }); e(20.0, 'impact');
  e(20.2, 'type', { d: .2, n: 6 });
  TERM.forEach(l => {
    if (l.k === 'cmd') { const n = Array.from(l.s).length; for (let i = 0; i < n; i++) e(l.t + l.d * i / n, 'key', { i }); }
    else e(l.t, l.k === 'ok' ? 'ding' : 'reply');
  });
  e(25.95, 'whoosh', { d: .25 }); for (let k = 0; k < 8; k++) e(25.95 + k * .125, 'pop');
  e(27.95, 'whoosh', { d: .3 }); e(28.45, 'riser', { d: .5 });
  for (let i = 0; i < URL.length; i++) e(28.95 + .45 * i / URL.length, 'key', { i });
  e(29.45, 'tick'); e(29.53, 'tick'); e(29.95, 'sweep', { d: .5 }); e(30.45, 'tick'); e(30.95, 'tick');
  e(31.5, 'scan', { d: .5 }); e(32.0, 'impact'); e(32.45, 'whoosh', { d: .4 }); e(32.95, 'steps', { d: .8 }); e(33.45, 'scribble', { d: .3 });
  return E;
}

// ───────────────────────── setup & playback ─────────────────────────
async function setup() {
  const loads = [];
  for (const w of [600, 700, 800, 900]) loads.push(document.fonts.load(`${w} 40px Geist`, 'Ab'), document.fonts.load(`${w} 40px BP`, '가'));
  for (const w of [600, 700]) loads.push(document.fonts.load(`${w} 40px 'Geist Mono'`, 'Ab'));
  await Promise.all(loads); await document.fonts.ready;
  G = L;
  const m = measure('bizplan', 100, 900); TS = 100 * TITLE_W / m.width;
  const mm = measure('bizplan', TS, 900); TA = mm.actualBoundingBoxAscent; TD = mm.actualBoundingBoxDescent;
  RAIL0 = 372; LT = RAIL0 + 96; TY = LT + TA;
  const km = measure('사업계획서', 100, 800); KA = km.actualBoundingBoxAscent; KD = km.actualBoundingBoxDescent;
  GRAIN = noiseCanvas(7, r => { const v = r(); const a = v > .55 ? (v - .55) * 70 : 0; return [70, 60, 40, a]; });
  TOOTH = noiseCanvas(11, r => { const v = r(); return [0, 0, 0, v > .62 ? 60 + r() * 120 : 0]; });
}

const params = new URLSearchParams(location.search), renderMode = params.has('render');
function fit() { const s = renderMode ? 1 : Math.min(innerWidth / W, innerHeight / H); cv.style.transform = `scale(${s})`; }
addEventListener('resize', fit); fit();

window.__duration = DUR;
window.__ready = setup().then(() => {
  window.__seek = t => render(((t % DUR) + DUR) % DUR);
  window.__events = events();
  render(0);
  if (!renderMode) {
    let paused = false, off = 0, t0 = performance.now();
    const loop = now => { if (!paused) render(((now - t0) / 1000 + off) % DUR); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
    addEventListener('keydown', e => { if (e.code !== 'Space') return; if (paused) { t0 = performance.now(); paused = false; } else { off += (performance.now() - t0) / 1000; paused = true; } });
  }
});
})();
