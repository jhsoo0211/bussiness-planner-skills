  else if (t < FLOOD[0] + FLOOD[1]) {
    const R = STAMP[2] + 2300 * XI(t, FLOOD[0], FLOOD[1]);
    pass('paper', t); pass('blue', t, g => g.arc(STAMP[0], STAMP[1], R, 0, Math.PI * 2));
  } else if (t < SCAN1) pass('blue', t);
  else if (t < SCAN1 + .5) {
    const y = mix(-4, H + 4, XIO(t, SCAN1, .5));
    pass('blue', t, g => g.rect(0, y, W, H - y)); pass('note', t, g => g.rect(0, 0, W, y)); scanLine(y);
  } else if (t < SCAN2) pass('note', t);
  else if (t < SCAN2 + .5) {
    const y = mix(H + 4, -4, XIO(t, SCAN2, .5));
    pass('note', t, g => g.rect(0, 0, W, y)); pass('paper', t, g => g.rect(0, y, W, H - y)); scanLine(y);
  } else pass('paper', t);
}

// ───────────────────────── sound events & music map (read by sound.py) ─────────────────────────
function events() {
  const E = [], e = (t, kind, x = {}) => E.push({ t: +t.toFixed(4), kind, ...x });
  const keys = (str, t0, d) => { const n = len(str); for (let i = 0; i < n; i++) e(t0 + d * i / n, 'key'); };
  e(0, 'steps', { d: .45 }); e(.36, 'whoosh', { d: .14 }); e(.5, 'press');
  e(.95, 'pencil', { d: .3 }); e(1.0, 'ticks', { d: .4 }); e(1.45, 'pencil', { d: .25 });
  e(2.0, 'scribble', { d: .4 }); e(2.2, 'whip'); e(2.95, 'pencil', { d: .25 }); e(3.7, 'clap');
  for (let i = 0; i < 7; i++) e(3.8 + i * .06, 'drop'); e(4.95, 'clap');
  const o = SEC.outline;
  e(o + .05, 'pencil', { d: .25 }); e(o + .15, 'scribble', { d: .4 });
  for (let i = 0; i < 4; i++) { e(o + .45 + i * .75, 'pencil', { d: .2 }); e(o + .5 + i * .75, 'scribble', { d: .7 }); }
  e(o + 3.45, 'scribble', { d: .35 }); e(o + 3.95, 'stamp'); e(o + 4.45, 'scribble', { d: .4 });
  const p = SEC.psst;
  e(p - .05, 'whoosh', { d: .25 }); for (let i = 0; i < 4; i++) e(p + .45 + i * .3, 'stamp', { soft: 1 }); e(p + 1.95, 'scribble', { d: .45 });
  const m = SEC.match;
  e(m - .05, 'whoosh', { d: .3 }); e(m + .15, 'scribble', { d: .5 }); for (let j = 0; j < 3; j++) e(m + .95 + j * .3, 'pencil', { d: .25 });
  e(m + 1.95, 'stamp'); e(FLOOD[0], 'flood', { d: FLOOD[1] }); e(FLOOD[0] + FLOOD[1], 'impact');
  const k = SEC.market;
  e(k + .1, 'tick'); e(k + .45, 'tick'); e(k + .95, 'tick'); e(k + 1.45, 'type', { d: .4, n: 12 });
  const r = SEC.review;
  e(r - .05, 'whoosh', { d: .25 }); e(r + .05, 'riser', { d: 1.0 }); for (let j = 0; j < 4; j++) e(r + .95 + j * .3, 'stamp', { soft: 1 }); e(r + 2.45, 'tick'); e(r + 2.55, 'tick');
  const q = SEC.pitch;
  e(q - .05, 'whoosh', { d: .25 }); for (let i = 0; i < 6; i++) e(q + .45 + i * .04, 'pop'); for (let i = 0; i < 6; i++) e(q + 1.2 + i * .15, 'tick', { soft: 1 }); e(q + 1.95, 'tick');
  const x = SEC.export;
  e(x - .05, 'whoosh', { d: .25 }); e(x + .25, 'type', { d: .6, n: 12 }); e(x + .95, 'stamp'); e(SCAN1, 'scan', { d: .5 }); e(SCAN1 + .5, 'impact');
  const c = SEC.chat;
  e(c + .15, 'tick'); e(c + .23, 'tick'); keys(LINK, c + .5, .8); keys(S.chatAsk, c + 1.45, .3); e(c + 1.8, 'pop');
  for (let i = 0; i < 4; i++) e(c + 1.95 + i * .125, 'tick', { soft: 1 }); e(c + 2.45, 'ding');
  e(c + 3.4, 'pop'); keys(S.chatCmd, c + 3.45, .5); e(c + 4.45, 'reply');
  e(SEC.term - .05, 'whoosh', { d: .25 });
  TERM.forEach(l => { if (l.k === 'cmd') keys(l.s, l.t, l.d); else e(l.t, 'ding'); });
  const sk = SEC.skills;
  e(sk - .05, 'whoosh', { d: .25 }); for (let i = 0; i < 8; i++) e(sk - .05 + i * .1, 'pop'); for (let i = 0; i < 4; i++) e(sk + 1.2 + i * .25, 'tick', { soft: 1 });
  const li = SEC.link;
  e(li - .05, 'whoosh', { d: .3 }); e(li + .45, 'riser', { d: .5 }); keys(URL, li + .95, .5); e(li + 1.45, 'tick'); e(li + 1.53, 'tick'); e(li + 1.95, 'sweep', { d: .5 });
  e(SCAN2, 'scan', { d: .5 }); e(SEC.end - .05, 'whoosh', { d: .4 }); e(SEC.end + .25, 'steps', { d: .8 }); e(SEC.end + .75, 'scribble', { d: .3 });
  return E;
}
function musicMap() {
  const styles = [];
  for (let b = 0; b < DUR / 2; b++) { const t0 = b * 2; styles.push(t0 < 16 ? 'paper' : t0 < 30 ? 'blue' : t0 < SEC.end ? 'note' : 'paper'); }
  return { bpm: BPM, styles };
}

// ───────────────────────── setup & playback ─────────────────────────
async function setup() {
  const loads = [];
  for (const w of [600, 700, 800, 900]) loads.push(document.fonts.load(`${w} 40px Geist`, 'Ab'), document.fonts.load(`${w} 40px BP`, '가'));
  for (const w of [600, 700]) loads.push(document.fonts.load(`${w} 40px 'Geist Mono'`, 'Ab'));
  await Promise.all(loads); await document.fonts.ready;
  G = L;
  const m = measure('bizplan', 100, 900); TS = 100 * TITLE_W / m.width;
  const mm = measure('bizplan', TS, 900); TA = mm.actualBoundingBoxAscent; TD = mm.actualBoundingBoxDescent;
  RAIL0 = 372; LT = RAIL0 + 96; TY = LT + TA;
  const km = measure(PH_A + PH_B, 100, 800); KA = km.actualBoundingBoxAscent; KD = km.actualBoundingBoxDescent;
  PH = Math.min(132, 132 * 1480 / (tw(PH_A, 132, 800) + 44 + tw(PH_B, 132, 800)));
  GRAIN = noiseCanvas(7, r => { const v = r(); return [70, 60, 40, v > .55 ? (v - .55) * 70 : 0]; });
  TOOTH = noiseCanvas(11, r => { const v = r(); return [0, 0, 0, v > .62 ? 60 + r() * 120 : 0]; });
}

const renderMode = new URLSearchParams(location.search).has('render');
function fit() { const s = renderMode ? 1 : Math.min(innerWidth / W, innerHeight / H); cv.style.transform = `scale(${s})`; }
addEventListener('resize', fit); fit();

window.__duration = DUR;
window.__ready = setup().then(() => {
  window.__seek = t => render(((t % DUR) + DUR) % DUR);
  window.__events = events();
  window.__music = musicMap();
  render(0);
  if (!renderMode) {
    let paused = false, off = 0, t0 = performance.now();
    const loop = now => { if (!paused) render(((now - t0) / 1000 + off) % DUR); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
    addEventListener('keydown', e => { if (e.code !== 'Space') return; if (paused) { t0 = performance.now(); paused = false; } else { off += (performance.now() - t0) / 1000; paused = true; } });
  }
});
})();
